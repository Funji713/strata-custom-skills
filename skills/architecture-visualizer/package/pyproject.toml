[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-visualizer"
version = "1.0.0"
description = "Evidence-grounded, deterministic architecture visualization"
requires-python = ">=3.10"

[project.scripts]
architecture-visualizer = "architecture_visualizer.cli:main"

[tool.setuptools.packages.find]
include = ["architecture_visualizer*"]
